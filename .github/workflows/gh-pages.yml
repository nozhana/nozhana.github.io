name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Log Pages CMS payload
        id: payload
        if: github.event_name == 'workflow_dispatch'
        env:
          PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          ACTION_LABEL=$(jq -r '.action.label // .action.name // "n/a"' <<< "$PAYLOAD")
          TRIGGER_TYPE=$(jq -r '.triggerType // "n/a"' <<< "$PAYLOAD")
          TRIGGERED_AT=$(jq -r '.triggeredAt // "n/a"' <<< "$PAYLOAD")
          TRIGGERED_BY_NAME=$(jq -r '.triggeredBy.name // "n/a"' <<< "$PAYLOAD")
          TRIGGERED_BY_USER=$(jq -r '.triggeredBy.githubUsername // "n/a"' <<< "$PAYLOAD")
          REPO_OWNER=$(jq -r '.repository.owner // "n/a"' <<< "$PAYLOAD")
          REPO_NAME=$(jq -r '.repository.repo // "n/a"' <<< "$PAYLOAD")
          REPO_REF=$(jq -r '.repository.ref // "n/a"' <<< "$PAYLOAD")
          CONTEXT_TYPE=$(jq -r '.context.type // "n/a"' <<< "$PAYLOAD")
          CONTEXT_NAME=$(jq -r '.context.name // "n/a"' <<< "$PAYLOAD")
          CONTEXT_PATH=$(jq -r '.context.path // "n/a"' <<< "$PAYLOAD")
          DRAFTS=$(jq -r '.inputs.drafts // false' <<< "$PAYLOAD")
          TIMEZONE=$(jq -r '.inputs.timezone // ""' <<< "$PAYLOAD")

          echo "Action: $ACTION_LABEL"
          echo "Trigger type: $TRIGGER_TYPE"
          echo "Triggered at: $TRIGGERED_AT"
          echo "Triggered by: $TRIGGERED_BY_NAME (@$TRIGGERED_BY_USER)"
          echo "Repository: $REPO_OWNER/$REPO_NAME@$REPO_REF"
          echo "Context: $CONTEXT_TYPE $CONTEXT_NAME ($CONTEXT_PATH)"
          echo "Drafts requested: $DRAFTS"
          echo "Timezone override requested: ${TIMEZONE:-<none>}"

          if [ "$DRAFTS" = "true" ]; then
            echo "drafts_flag=-D" >> "$GITHUB_OUTPUT"
          else
            echo "drafts_flag=" >> "$GITHUB_OUTPUT"
          fi

          echo "timezone=$TIMEZONE" >> "$GITHUB_OUTPUT"

      # Pages CMS always writes post dates with a +00:00 offset regardless of
      # the timezone the editor actually meant (a known Pages CMS bug), so
      # this repairs any not-yet-fixed dates before building when the
      # deploy-site action was given a timezone override.
      - name: Fix post timezone
        if: github.event_name == 'workflow_dispatch' && steps.payload.outputs.timezone != ''
        env:
          TIMEZONE: ${{ steps.payload.outputs.timezone }}
        run: |
          if ! [[ "$TIMEZONE" =~ ^[+-][0-9]{2}:[0-9]{2}$ ]]; then
            echo "Ignoring invalid timezone override: $TIMEZONE"
            exit 0
          fi

          MATCHES=$(grep -rlE '^date: .*\+00:00$' content || true)
          if [ -z "$MATCHES" ]; then
            echo "No dates with +00:00 offset found, nothing to fix."
            exit 0
          fi

          echo "Fixing timezone offset to $TIMEZONE in:"
          echo "$MATCHES"

          echo "$MATCHES" | while IFS= read -r file; do
            sed -i -E "s/^date: (.*)\+00:00\$/date: \1${TIMEZONE}/" "$file"
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "No changes after fix, skipping commit."
          else
            git commit -m "fix: correct Pages CMS timezone offset to ${TIMEZONE}"
            git push
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # The well-traveled theme's SCSS uses @use module syntax, which only
      # Dart Sass supports (Hugo Extended's bundled LibSass is deprecated
      # and can't parse it), so the blog subsite build needs it on PATH.
      # `npm install -g sass` installs the JS wrapper package, not the real
      # `dart-sass` executable Hugo's dartsass transpiler execs directly -
      # that mismatch is what threw "unexpected EOF when executing sass".
      # Fetch the actual binary release instead, per Hugo's own docs.
      - name: Install Dart Sass
        env:
          DART_SASS_VERSION: 1.103.1
        run: |
          curl -sfL -o "${{ runner.temp }}/dart-sass.tar.gz" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${{ runner.temp }}" -xf "${{ runner.temp }}/dart-sass.tar.gz"
          echo "${{ runner.temp }}/dart-sass" >> "${GITHUB_PATH}"

      # Build the main site first, then the blog subsite. The blog
      # environment's publishDir (public/blog) nests inside the main
      # site's publishDir (public), so the second build merges into the
      # first automatically. --cleanDestinationDir on the blog build
      # scopes cleaning to public/blog only, clearing any stray output
      # left by the main build's own "blog" content section without
      # touching the rest of public/.
      - name: Build main site
        run: hugo -e main --minify --cleanDestinationDir ${{ steps.payload.outputs.drafts_flag }}

      - name: Build blog subsite
        run: hugo -e blog --minify --cleanDestinationDir ${{ steps.payload.outputs.drafts_flag }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
