media:
  - name: images
    label: Images
    input: media/images
    output: /images
    categories: [image]
  - name: files
    label: Files
    input: media/files
    output: /files
    categories: [document, image]
content:
  - name: posts
    label: Posts
    type: group
    items:
      - name: tutorials
        label: Tutorials
        type: collection
        path: content/posts/tutorials
        fields:
          - name: title
            type: string
          - name: date
            type: date
            options:
              time: true
          - name: draft
            type: boolean
            default: true
            required: true
          - name: summary
            type: text
            required: true
          - name: cover
            type: image
          - name: categories
            type: string
            list: true
          - name: tags
            type: string
            list: true
          - name: body
            type: rich-text
      - name: private
        label: Private Posts
        type: collection
        path: content/posts/privates
        fields:
          - name: title
            type: string
            required: true
          - name: date
            type: date
            required: true
            options:
              time: true
          - name: draft
            type: boolean
            default: true
            required: true
          - name: summary
            type: text
            required: true
          - name: cover
            type: image
          - name: categories
            type: string
            list: true
          - name: tags
            type: string
            list: true
          - name: body
            type: rich-text
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    fields:
      - name: title
        type: string
        required: true
      - name: date
        type: date
        required: true
        options:
          time: true
      - name: draft
        type: boolean
        default: true
        required: true
      - name: slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        options:
          minlength: 3
          maxlength: 80
      - name: summary
        type: text
        required: true
      - name: featured
        type: boolean
        required: true
      - name: categories
        type: string
        default: "projects"
        readonly: true
      - name: tags
        type: string
        list: true
      - name: cover
        type: image
        options:
          media: images
      - name: link
        type: string
        required: true
        pattern:
          regex: "https?:\\/\\/(www\\.)?[-a-zA-Z0-9@:%._\\+~#=]{1,256}\\.[a-zA-Z0-9()]{1,6}\\b([-a-zA-Z0-9()@:%_\\+.~#?&//=]*)"
          message: "Invalid URL"
      - name: status
        type: select
        options:
          values:
            - name: in-progress
              label: In Progress
            - name: completed
              label: Completed
      - name: body
        type: rich-text
  - name: resume
    label: Resume
    type: file
    path: content/resume.md
    fields:
      - name: title
        type: string
        required: true
      - name: layout
        type: string
        readonly: true
      - name: description
        type: text
        required: true
      - name: name
        type: string
        required: true
      - name: jobtitle
        label: job title
        type: string
        required: true
      - name: location
        type: string
        required: true
      - name: email
        type: string
        required: true
      - name: phone
        type: string
      - name: website
        type: string
      - name: linkedin
        type: string
      - name: github
        type: string
      - name: summary
        type: text
        required: true
      - name: experience
        type: object
        list: true
        fields:
          - name: company
            type: string
            required: true
          - name: title
            type: string
            required: true
          - name: location
            type: string
          - name: start
            type: string
            required: true
          - name: end
            type: string
            required: true
          - name: highlights
            type: string
            list: true
          - name: stack
            type: string
            list: true
      - name: education
        type: object
        list: true
        fields:
          - name: institution
            type: string
            required: true
          - name: degree
            type: string
            required: true
          - name: location
            type: string
          - name: start
            type: string
            required: true
          - name: end
            type: string
            required: true
          - name: description
            type: string
      - name: skills
        type: object
        list: true
        fields:
          - name: category
            type: string
            required: true
          - name: items
            type: string
            list: true
      - name: certifications
        type: object
        list: true
        fields:
          - name: name
            type: string
            required: true
          - name: issuer
            type: string
            required: true
          - name: date
            type: string
            required: true
          - name: url
            type: string
      - name: languages
        type: object
        list: true
        fields:
          - name: language
            type: string
            required: true
          - name: level
            type: string
            required: true
actions:
  - name: deploy-site
    label: Deploy site
    description: Build and deploy the site to GitHub Pages
    workflow: gh-pages.yml
    fields:
      - name: drafts
        label: Include drafts
        type: checkbox
        default: false
